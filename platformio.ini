; =============================================================================
;  Spotify "Now Playing" display
;  ESP32-WROOM-32 DevKit (38-pin)  +  4.0" 480x320 SPI TFT (ILI9488) + XPT2046
;
;  PIN CONFIGURATION LIVES IN  include/display_config.h  - NOT HERE.
;
;  That header is force-included into every translation unit by the
;  `-include` flag below, so TFT_eSPI picks up its configuration from the
;  same file our own code reads. One file, one truth, no drift between
;  build_flags and application code.
;
;  Because USER_SETUP_LOADED=1 is set there, TFT_eSPI skips its own
;  User_Setup.h / User_Setup_Select.h entirely. Never edit files under
;  .pio/libdeps/.../TFT_eSPI/ - they are regenerated on every clean build.
; =============================================================================

[env:esp32dev]
platform        = espressif32@^6.12.0
board           = esp32dev           ; any 38-pin ESP32-WROOM-32 DevKit
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

; Makes edits to include/display_config.h trigger a rebuild. Without it,
; SCons never sees the force-included header and silently flashes stale
; firmware after a pin change. Read the script - the failure it prevents is
; not obvious.
extra_scripts = pre:tools/pio_config_fingerprint.py

; The default esp32dev partition table gives the app only 1.31 MB, which
; TFT_eSPI + mbedTLS + WiFi + fonts overruns. huge_app.csv gives 3 MB to a
; single app image (no OTA slot). Switch to min_spiffs.csv (1.9 MB app,
; keeps an OTA slot) if you later add over-the-air updates.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.4.3
    ; Paul Stoffregen's registry copy is published without a semver tag, so
    ; it must be requested unversioned (the content is v1.4).
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    ; ---------------------------------------------------------------------
    ;  Force-include the hardware configuration ahead of every source file,
    ;  including TFT_eSPI's own sources and the C sources in TJpg_Decoder.
    ;  This is why display_config.h must stay valid C as well as C++.
    ; ---------------------------------------------------------------------
    -include $PROJECT_INCLUDE_DIR/display_config.h

    ; Arduino-ESP32 log level: 1 = errors only. Raise to 4 for verbose
    ; WiFi/TLS diagnostics when debugging a connection problem.
    -D CORE_DEBUG_LEVEL=1

; NOTE on the loop task stack: mbedTLS needs a generous stack for chain
; verification, and the Arduino default of 8 KB is marginal once TLS, JSON
; parsing and JPEG decoding share it. It CANNOT be raised with a -D flag -
; the SDK's own sdkconfig.h redefines CONFIG_ARDUINO_LOOP_STACK_SIZE later
; in the include order and silently wins. src/main.cpp calls the supported
; macro SET_LOOP_TASK_STACK_SIZE() instead.
